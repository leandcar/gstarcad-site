<section class="cta on-dark">
  <app-animated-bg variant="mesh" />
  <div class="container cta__inner">
    <h2>{{ title }}</h2>
    <p class="lead">{{ subtitle }}</p>
    <div class="cta__actions">
      <a class="btn btn--wa btn--lg" [href]="wa" target="_blank" rel="noopener">
        Falar no WhatsApp
      </a>
      <a class="btn btn--light btn--lg" routerLink="/orcamento">Solicitar orçamento</a>
    </div>
  </div>
</section>
