<article class="pc" [class.pc--featured]="product.featured">
  @if (product.badge) { <span class="pc__badge">{{ product.badge }}</span> }
  @if (product.image) {
    <div class="pc__media">
      <img [src]="product.image" [alt]="'Caixa do ' + product.name" loading="lazy" decoding="async"
        width="320" height="400" />
    </div>
  } @else {
    <div class="pc__icon" aria-hidden="true">{{ product.icon }}</div>
  }
  <h3 class="pc__title">{{ product.name }}</h3>
  <p class="pc__tag">{{ product.tagline }}</p>

  <ul class="pc__highlights" role="list">
    @for (h of product.highlights.slice(0, 3); track h) {
      <li>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="m5 13 4 4L19 7" />
        </svg>{{ h }}
      </li>
    }
  </ul>

  <div class="pc__licenses">
    @for (l of product.licenses; track l) { <span class="chip">{{ l }}</span> }
  </div>

  <div class="pc__foot">
    <a class="pc__trial" routerLink="/downloads" [queryParams]="{ produto: product.slug }">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" />
      </svg>
      {{ trialLabel }}
    </a>
    <a class="btn btn--primary" [routerLink]="['/produtos', product.slug]">Ver detalhes</a>
  </div>
</article>
